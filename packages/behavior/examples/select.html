<div class="ml-select-root" data-ml="select">
  <span class="ml-select-label" id="fruit-label">Fruit</span>
  <div class="ml-select-control">
    <button class="ml-select" type="button" role="combobox" aria-expanded="false" aria-controls="fruit-list" aria-labelledby="fruit-label" data-state="closed">
      <span class="ml-select-value" data-placeholder>Select…</span>
      <span class="ml-select-chevron" aria-hidden="true"><svg class="mlola-glyph" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg></span>
    </button>
  </div>
  <div class="ml-select-popover" hidden>
    <ul class="ml-select-list" id="fruit-list" role="listbox" aria-labelledby="fruit-label">
      <li class="ml-select-option" id="opt-apple" role="option" aria-selected="false" data-state="unchecked">Apple</li>
      <li class="ml-select-option" id="opt-pear" role="option" aria-selected="false" data-state="unchecked">Pear</li>
      <li class="ml-select-option" id="opt-durian" role="option" aria-selected="false" aria-disabled="true" data-state="unchecked">Durian</li>
    </ul>
  </div>
</div>
