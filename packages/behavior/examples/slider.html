<div class="ml-slider-field" data-ml="slider" data-size="md" data-ml-step="5">
  <div class="ml-slider-header">
    <span class="ml-slider-label" id="bright-label">Brightness</span>
    <span class="ml-slider-output">40</span>
  </div>
  <div class="ml-slider">
    <div class="ml-slider-track">
      <span class="ml-slider-range" style="width: 40%"></span>
      <span class="ml-slider-thumb" id="bright-thumb" role="slider" tabindex="0"
            aria-labelledby="bright-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40"
            style="left: 40%"></span>
    </div>
  </div>
</div>
