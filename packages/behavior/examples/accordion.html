<div class="ml-accordion" data-ml="accordion">
  <article class="ml-accordion-item" data-state="open">
    <h3 class="ml-accordion-heading">
      <button id="t1" class="ml-accordion-trigger" data-state="open" aria-expanded="true" aria-controls="p1">
        <span>Is there a free plan?</span>
        <svg class="mlola-glyph" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </h3>
    <div id="p1" class="ml-accordion-panel" role="region" aria-labelledby="t1" data-state="open">
      <p>Yes. The components in the open-source registry are free forever.</p>
    </div>
  </article>
  <article class="ml-accordion-item" data-state="closed">
    <h3 class="ml-accordion-heading">
      <button id="t2" class="ml-accordion-trigger" data-state="closed" aria-expanded="false" aria-controls="p2">
        <span>Can I change themes later?</span>
        <svg class="mlola-glyph" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </h3>
    <div id="p2" class="ml-accordion-panel" role="region" aria-labelledby="t2" data-state="closed" hidden>
      <p>Change data-theme on any ancestor. Nothing else moves.</p>
    </div>
  </article>
</div>
