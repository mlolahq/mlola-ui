<button class="ml-button" type="button" data-variant="secondary" data-ml-opens="account-settings">
  <span class="ml-button-label">Settings</span>
</button>

<div class="ml-sheet-overlay" data-ml-for="account-settings" hidden></div>
<div class="ml-sheet-panel" id="account-settings" data-ml="sheet" role="dialog" aria-modal="true" aria-labelledby="account-settings-title" data-side="right" data-size="md" tabindex="-1" hidden>
  <div class="ml-sheet-header">
    <div class="ml-sheet-heading">
      <h2 class="ml-sheet-title" id="account-settings-title">Account settings</h2>
      <p class="ml-sheet-description">Changes apply instantly.</p>
    </div>
    <button class="ml-sheet-close" type="button" aria-label="Close panel"><svg class="mlola-glyph" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="ml-sheet-body">
    <p>Escape closes the panel, and so does the backdrop.</p>
  </div>
</div>
