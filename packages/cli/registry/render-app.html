.ml-grid[data-layout="4-col"] {
  grid-template-columns: repeat(4,minmax(0,1fr));
}

.ml-grid[data-layout="list"] {
  grid-template-columns: 1fr;
}

@media(max-width:64rem) {
  .ml-grid[data-columns="4"],
  .ml-grid[data-columns="6"],
  .ml-grid[data-layout="4-col"] {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }
}

@media(max-width:48rem) {
  .ml-grid[data-columns="3"],
  .ml-grid[data-columns="4"],
  .ml-grid[data-columns="6"],
  .ml-grid[data-layout="3-col"],
  .ml-grid[data-layout="4-col"] {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }
}

@media(max-width:36rem) {
  .ml-grid[data-columns],
  .ml-grid[data-layout] {
    grid-template-columns: 1fr;
  }
}

.ml-form {
  display: grid;
  gap: var(--ml-space-4);
}

.ml-form-message {
  font-size: var(--ml-type-sm);
  color: var(--ml-text-muted);
}

.ml-form-message[data-tone="success"] {
  color: var(--ml-success-text);
}

.ml-form-message[data-tone="danger"] {
  color: var(--ml-danger-text);
}

.ml-form-options {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--ml-space-4);
  font-size: var(--ml-type-sm);
}

.ml-form-options .ml-link,
.ml-form-options .ml-checkbox-label {
  font-weight: 500;
}

.ml-inline-form {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: var(--ml-space-3);
}

.ml-inline-form-field {
  flex: 1 1 16rem;
  min-width: 0;
}

.ml-inline-form .ml-form-message {
  flex-basis: 100%;
  order: 3;
  margin: 0;
}

.ml-brand {
  display: inline-flex;
  align-items: center;
  gap: var(--ml-space-2-5);
  text-decoration: none;
  color: var(--ml-text);
  font-weight: 700;
}

.ml-brand-mark {
  display: grid;
  place-items: center;
  width: 2rem;
  height: 2rem;
  border-radius: var(--ml-radius-sm);
  background: var(--ml-primary);
  color: var(--ml-primary-foreground);
  font-size: var(--ml-type-base);
  font-weight: 800;
}

.ml-brand-mark[data-kind="logo"] {
  background: none;
  color: var(--ml-text);
}

.ml-brand-mark[data-kind="logo"] > :is(svg, img) {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.ml-brand-name {
  font-size: var(--ml-type-md);
  letter-spacing: -.02em;
}

.ml-chart {
  display: grid;
  gap: var(--ml-space-3);
}

.ml-chart-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--ml-space-3);
  font-size: var(--ml-type-sm);
  font-weight: 700;
  color: var(--ml-text-muted);
}

.ml-chart-bars {
  display: flex;
  align-items: flex-end;
  gap: var(--ml-space-1-5);
  height: 7.5rem;
  padding: var(--ml-space-4);
  border-radius: var(--ml-radius-md);
  background: var(--ml-background-subtle);
}

.ml-chart-bar {
  flex: 1;
  height: var(--ml-value,40%);
  min-height: var(--ml-space-1-5);
  border-radius: var(--ml-radius-xs) var(--ml-radius-xs) 0 0;
  background: color-mix(in srgb,var(--ml-primary) 55%,var(--ml-border));
}

.ml-chart-bar[data-highlighted="true"] {
  background: var(--ml-primary);
}

.ml-stat-list {
  display: flex;
  flex-wrap: wrap;
  gap: var(--ml-space-6) var(--ml-space-8);
  margin: 0;
  padding: 0;
}

.ml-stat-list .ml-stat {
  padding: 0;
  border: 0;
  background: transparent;
  box-shadow: none;
}

.ml-stat,
.ml-stat-card {
  display: grid;
  gap: var(--ml-space-1);
}

.ml-stat-card {
  padding: var(--ml-space-5);
  border: var(--ml-border-width) solid var(--ml-border-subtle);
  border-radius: var(--ml-radius-lg);
  background: var(--ml-surface);
  box-shadow: var(--ml-shadow-xs);
}

.ml-stat-value,
.ml-stat-list .ml-stat dd {
  font-size: var(--ml-type-2xl);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
  margin: 0;
}

.ml-stat-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--ml-space-2);
  font-size: var(--ml-type-sm);
  color: var(--ml-text-muted);
}

.ml-stat-grid {
  align-items: stretch;
}

.ml-icon-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.5rem;
  height: 2.5rem;
  border-radius: var(--ml-radius-md);
  background: var(--ml-primary-subtle);
  color: var(--ml-primary-text);
}

.ml-price {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--ml-space-1-5);
  font-size: var(--ml-type-display-md);
  font-weight: 800;
  letter-spacing: -.03em;
}

.ml-price span,
.ml-price del {
  font-size: var(--ml-type-base);
  font-weight: 500;
  color: var(--ml-text-muted);
}

.ml-price del {
  text-decoration: line-through;
}

.ml-person {
  display: flex;
  align-items: center;
  gap: var(--ml-space-3);
}

.ml-person-copy {
  display: grid;
  gap: var(--ml-space-0-5);
  font-size: var(--ml-type-sm);
  color: var(--ml-text-muted);
}

.ml-person-copy strong {
  color: var(--ml-text);
}

.ml-empty-state {
  display: grid;
  gap: var(--ml-space-3);
  place-items: center;
  padding: var(--ml-space-10) var(--ml-space-6);
  text-align: center;
  border: var(--ml-border-width) dashed var(--ml-border);
  border-radius: var(--ml-radius-lg);
  color: var(--ml-text-muted);
}

.ml-filter-group {
  display: flex;
  flex-wrap: wrap;
  gap: var(--ml-space-2);
  margin-block-end: var(--ml-space-6);
}

.ml-filter-chip {
  padding: var(--ml-space-1-5) var(--ml-space-3);
  border: var(--ml-border-width) solid var(--ml-border);
  border-radius: var(--ml-radius-pill);
  background: var(--ml-surface);
  font-size: var(--ml-type-sm);
  font-weight: 500;
  cursor: pointer;
  transition: background-color var(--ml-duration-fast);
}

.ml-filter-chip:hover {
  background: color-mix(in oklab,var(--ml-surface) 100%,var(--ml-text) 4%);
}

.ml-filter-chip[data-state="active"],
.ml-filter-chip[aria-pressed="true"] {
  background: var(--ml-primary);
  border-color: var(--ml-primary);
  color: var(--ml-primary-foreground);
}

.ml-definition-list {
  display: grid;
  gap: var(--ml-space-3);
  margin: 0;
}

.ml-definition-list dt {
  font-size: var(--ml-type-xs);
  font-weight: 500;
  color: var(--ml-text-muted);
}

.ml-definition-list dd {
  margin: 0;
  font-size: var(--ml-type-base);
}

.ml-page-shell {
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 100dvh;
  background: var(--ml-background);
  color: var(--ml-text);
}

.ml-page-shell > * {
  min-width: 0;
}

.ml-accordion {
  width: 100%;
}

.ml-accordion-item {
  border-bottom: var(--ml-border-width) solid var(--ml-border-subtle);
}

.ml-accordion-heading {
  margin: 0;
  font: inherit;
}

.ml-accordion-trigger {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  gap: var(--ml-space-4);
  padding: var(--ml-space-4) 0;
  border: 0;
  border-radius: var(--ml-radius-xs);
  background: transparent;
  color: var(--ml-text);
  text-align: start;
  font-size: var(--ml-type-base);
  font-weight: 500;
  cursor: pointer;
}

.ml-accordion-trigger:hover .ml-accordion-trigger-label {
  text-decoration: underline;
  text-decoration-color: color-mix(in oklab,var(--ml-text) 30%,transparent);
  text-underline-offset: .2em;
}

.ml-accordion-trigger:disabled .ml-accordion-trigger-label {
  text-decoration: none;
}

.ml-accordion-trigger-label {
  flex: 1;
}

.ml-accordion-chevron {
  flex: none;
  color: var(--ml-text-faint);
  transition: transform var(--ml-duration-normal) var(--ml-ease-spring);
}

.ml-accordion-item[data-state="open"] .ml-accordion-chevron {
  transform: rotate(180deg);
}

.ml-accordion-panel {
  padding: 0 0 var(--ml-space-4);
  color: var(--ml-text-muted);
}

.ml-accordion-panel[hidden] {
  display: none;
}

.ml-accordion-panel-inner {
  font-size: var(--ml-type-base);
  line-height: 1.55;
}

.ml-heatmap {
  --ml-heatmap-color: var(--ml-primary);
  --ml-heatmap-gap: var(--ml-space-1);
  --ml-heatmap-empty: color-mix(in oklab, var(--ml-text) 7%, var(--ml-surface));
  position: relative;
  display: grid;
  gap: var(--ml-space-3);
  width: 100%;
  color: var(--ml-text-muted);
  font-size: var(--ml-type-2xs);
}

.ml-heatmap[data-tone="info"] {
  --ml-heatmap-color: var(--ml-info);
}

.ml-heatmap[data-tone="success"] {
  --ml-heatmap-color: var(--ml-success);
}

.ml-heatmap[data-tone="warning"] {
  --ml-heatmap-color: var(--ml-warning);
}

.ml-heatmap-grid {
  display: grid;
  grid-template-columns: auto repeat(var(--ml-heatmap-weeks), minmax(0, 1fr));
  gap: var(--ml-heatmap-gap);
}

.ml-heatmap-months,
.ml-heatmap-row {
  display: contents;
}

.ml-heatmap-month {
  grid-row: 1;
  overflow: visible;
  white-space: nowrap;
}

.ml-heatmap-weekday {
  grid-column: 1;
  display: flex;
  align-items: center;
  padding-inline-end: var(--ml-space-1);
  line-height: 1;
}

.ml-heatmap-weekday > [data-hidden] {
  visibility: hidden;
}

.ml-heatmap-cell {
  display: block;
  aspect-ratio: 1;
  border-radius: calc(var(--ml-radius-xs) * 0.75);
  background: var(--ml-heatmap-empty);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--ml-text) 4%, transparent);
  outline: none;
  transition: box-shadow var(--ml-duration-fast) var(--ml-ease-standard);
}

.ml-heatmap-cell[data-level="1"] {
  background: color-mix(in oklab, var(--ml-heatmap-color) 30%, var(--ml-heatmap-empty));
}

.ml-heatmap-cell[data-level="2"] {
  background: color-mix(in oklab, var(--ml-heatmap-color) 52%, var(--ml-heatmap-empty));
}

.ml-heatmap-cell[data-level="3"] {
  background: color-mix(in oklab, var(--ml-heatmap-color) 76%, var(--ml-heatmap-empty));
}

.ml-heatmap-cell[data-level="4"] {
  background: var(--ml-heatmap-color);
}

.ml-heatmap-cell[data-outside] {
  visibility: hidden;
}

.ml-heatmap-grid .ml-heatmap-cell:not([data-outside]) {
  cursor: default;
}

.ml-heatmap-cell[data-active] {
  box-shadow: 0 0 0 1.5px var(--ml-text);
}

.ml-heatmap-cell:focus-visible {
  box-shadow: 0 0 0 2px var(--ml-focus);
}

.ml-heatmap-tooltip {
  position: fixed;
  z-index: var(--ml-layer-tooltip);
  top: 0;
  left: 0;
  display: grid;
  gap: var(--ml-space-0-5);
  padding: var(--ml-space-1-5) var(--ml-space-2-5);
  border-radius: var(--ml-radius-sm);
  background: var(--ml-text);
  box-shadow: var(--ml-shadow-md);
  color: var(--ml-background);
  font-size: var(--ml-type-xs);
  line-height: 1.35;
  white-space: nowrap;
  pointer-events: none;
}

.ml-heatmap-tooltip > span {
  opacity: 0.72;
}

.ml-heatmap-footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--ml-space-2) var(--ml-space-4);
  font-size: var(--ml-type-xs);
}

.ml-heatmap-legend {
  display: inline-flex;
  align-items: center;
  gap: var(--ml-space-1);
}

.ml-heatmap-legend > .ml-heatmap-cell {
  width: 0.75rem;
}

.ml-heatmap-caption {
  font-variant-numeric: tabular-nums;
}

.ml-alert {
  --ml-alert-tone: var(--ml-text-muted);
  --ml-alert-on-tone: var(--ml-surface);
  --ml-alert-tone-text: var(--ml-text);
  --ml-alert-chip: 1.5rem;
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: var(--ml-space-3);
  width: 100%;
  align-items: start;
  padding: var(--ml-space-3-5) var(--ml-space-3-5) var(--ml-space-3-5) var(--ml-space-4);
  border: var(--ml-border-width) solid var(--ml-border-subtle);
  border-radius: var(--ml-radius-lg);
  background: var(--ml-surface);
  box-shadow: var(--ml-surface-highlight), var(--ml-shadow-xs);
  color: var(--ml-text);
  font-size: var(--ml-type-sm);
  animation: ml-alert-enter var(--ml-duration-normal) var(--ml-ease-spring) both;
}

.ml-alert[data-tone="info"] {
  --ml-alert-tone: var(--ml-info);
  --ml-alert-on-tone: var(--ml-info-foreground);
  --ml-alert-tone-text: var(--ml-info-text);
}

.ml-alert[data-tone="success"] {
  --ml-alert-tone: var(--ml-success);
  --ml-alert-on-tone: var(--ml-success-foreground);
  --ml-alert-tone-text: var(--ml-success-text);
}

.ml-alert[data-tone="warning"] {
  --ml-alert-tone: var(--ml-warning);
  --ml-alert-on-tone: var(--ml-warning-foreground);
  --ml-alert-tone-text: var(--ml-warning-text);
}

.ml-alert[data-tone="danger"] {
  --ml-alert-tone: var(--ml-danger);
  --ml-alert-on-tone: var(--ml-danger-foreground);
  --ml-alert-tone-text: var(--ml-danger-text);
}

.ml-alert[data-variant="soft"] {
  border-color: color-mix(in oklab, var(--ml-alert-tone) 24%, transparent);
  background: color-mix(in oklab, var(--ml-alert-tone) 8%, var(--ml-surface));
  box-shadow: none;
}

.ml-alert[data-variant="soft"][data-tone="neutral"] {
  border-color: var(--ml-border-subtle);
  background: var(--ml-background-subtle);
}

.ml-alert[data-variant="soft"] .ml-alert-title {
  color: var(--ml-alert-tone-text);
}

@keyframes ml-alert-enter {
  from {
    opacity: 0;
    transform: translateY(-0.25rem) scale(0.985);
  }
}

.ml-alert[data-state="closing"] {
  opacity: 0;
  transform: scale(0.98);
  transition: opacity var(--ml-duration-fast) var(--ml-ease-standard), transform var(--ml-duration-normal) var(--ml-ease-standard);
}

.ml-alert-icon {
  position: relative;
  display: inline-grid;
  width: var(--ml-alert-chip);
  height: var(--ml-alert-chip);
  place-items: center;
  margin-block: calc((1.4em - var(--ml-alert-chip)) / 2);
  border-radius: var(--ml-radius-sm);
  background: var(--ml-alert-tone);
  box-shadow: inset 0 1px 0 color-mix(in oklab, var(--ml-alert-on-tone) 22%, transparent), 0 1px 2px color-mix(in oklab, var(--ml-alert-tone) 35%, transparent);
  color: var(--ml-alert-on-tone);
  font-size: var(--ml-type-sm);
}

.ml-alert-icon svg {
  stroke-width: 2.25;
}

.ml-alert[data-tone="neutral"] .ml-alert-icon {
  background: var(--ml-fill-hover);
  box-shadow: none;
  color: var(--ml-text-muted);
}

.ml-alert[data-variant="soft"] .ml-alert-icon {
  background: transparent;
  box-shadow: none;
  color: var(--ml-alert-tone-text);
  font-size: var(--ml-type-base);
}

.ml-alert[data-tone="warning"] .ml-alert-icon::after,
.ml-alert[data-tone="danger"] .ml-alert-icon::after {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: 0 0 0 0 color-mix(in oklab, var(--ml-alert-tone) 50%, transparent);
  content: "";
  animation: ml-alert-pulse 1.2s var(--ml-ease-standard) 0.15s 2 both;
}

@keyframes ml-alert-pulse {
  70%,
  100% {
    box-shadow: 0 0 0 0.5rem transparent;
  }
}

.ml-alert-content {
  display: grid;
  min-width: 0;
  gap: var(--ml-space-0-5);
  line-height: 1.4;
}

.ml-alert-title {
  margin: 0;
  font-size: var(--ml-type-sm);
  font-weight: 600;
  line-height: 1.4;
}

.ml-alert-description {
  color: var(--ml-text-muted);
  font-size: var(--ml-type-sm);
  line-height: var(--ml-leading-normal);
}

.ml-alert-description a {
  color: var(--ml-text);
  font-weight: 500;
  text-decoration: underline;
  text-decoration-color: color-mix(in oklab, currentColor 35%, transparent);
  text-underline-offset: 0.2em;
}

.ml-alert-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--ml-space-1-5);
  margin-block: calc((1.4em - var(--ml-control-sm)) / 2);
}

.ml-alert-dismiss {
  display: inline-grid;
  width: var(--ml-control-sm);
  height: var(--ml-control-sm);
  place-items: center;
  border: 0;
  border-radius: var(--ml-radius-sm);
  background: transparent;
  color: var(--ml-text-faint);
  cursor: pointer;
  transition: background-color var(--ml-duration-fast) var(--ml-ease-standard), color var(--ml-duration-fast) var(--ml-ease-standard);
}

.ml-alert-dismiss:hover {
  background: var(--ml-fill-hover);
  color: var(--ml-text);
}

.ml-alert-dismiss:focus-visible {
  outline: 2px solid var(--ml-focus);
  outline-offset: 1px;
}

@media (prefers-reduced-motion: reduce) {
  .ml-alert,
  .ml-alert-icon::after {
    animation: none;
  }

  .ml-alert[data-state="closing"] {
    transition: none;
  }
}

.ml-app-shell {
  display: grid;
  height: 100%;
  min-height: 0;
}

.ml-app-shell-frame {
  --ml-resizable-handle: var(--ml-border-width);
  min-height: 0;
}

.ml-app-shell-sidebar {
  height: 100%;
  min-height: 0;
}

.ml-app-shell-main {
  height: 100%;
  min-width: 0;
  min-height: 0;
}

.ml-app-shell[data-narrow] .ml-app-shell-frame.ml-resizable[data-direction] {
  grid-template-columns: 0 0 minmax(0, 1fr);
}

.ml-app-shell[data-narrow] .ml-app-shell-frame > :first-child,
.ml-app-shell[data-narrow] .ml-app-shell-frame > [role="separator"] {
  visibility: hidden;
}

.ml-app-shell-drawer > .ml-app-shell-sidebar {
  height: 100%;
}

.ml-app-shell-menu {
  display: inline-grid;
  width: var(--ml-control-sm);
  height: var(--ml-control-sm);
  flex: none;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: var(--ml-radius-sm);
  background: transparent;
  color: var(--ml-text-muted);
  cursor: pointer;
}

.ml-app-shell-menu:hover {
  background: var(--ml-fill-hover);
  color: var(--ml-text);
}

.ml-app-shell-menu:focus-visible {
  outline: 2px solid var(--ml-focus);
  outline-offset: 1px;
}

.ml-sidebar {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: var(--ml-space-3);
  height: 100%;
  min-height: 0;
  padding: var(--ml-space-3) var(--ml-space-2);
  background: var(--ml-background-subtle);
  color: var(--ml-text);
  font-size: var(--ml-type-sm);
}

.ml-sidebar-header,
.ml-sidebar-footer {
  display: flex;
  align-items: center;
  gap: var(--ml-space-2);
  padding-inline: var(--ml-space-1);
}

.ml-sidebar-body {
  display: grid;
  align-content: start;
  gap: var(--ml-space-4);
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: thin;
}

.ml-sidebar-section {
  display: grid;
  gap: var(--ml-space-1);
}

.ml-sidebar-title {
  display: flex;
  align-items: center;
  gap: var(--ml-space-1);
  margin: 0;
  padding: 0 var(--ml-space-2);
  border: 0;
  background: transparent;
  color: var(--ml-text-faint);
  font: inherit;
  font-size: var(--ml-type-2xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-align: start;
  text-transform: uppercase;
}

.ml-sidebar-title[data-collapsible] {
  cursor: pointer;
}

.ml-sidebar-title[data-collapsible]:hover {
  color: var(--ml-text-muted);
}

.ml-sidebar-chevron {
  transition: rotate var(--ml-duration-fast) var(--ml-ease-standard);
}

.ml-sidebar-title[aria-expanded="false"] .ml-sidebar-chevron {
  rotate: -90deg;
}

.ml-sidebar-list {
  display: grid;
  gap: 1px;

@keyframes ml-toast-in { from{opacity:0;transform:translateY(1rem)}to{opacity:1;transform:translateY(0)} }

@keyframes ml-slide-left { from{transform:translateX(100%)}to{transform:translateX(0)} }

@keyframes ml-slide-right { from{transform:translateX(-100%)}to{transform:translateX(0)} }

@keyframes ml-slide-up { from{transform:translateY(100%)}to{transform:translateY(0)} }

@keyframes ml-slide-down { from{transform:translateY(-100%)}to{transform:translateY(0)} }

@keyframes ml-panel-in { from{opacity:0;transform:var(--ml-enter-from)} }

@keyframes ml-shimmer { from{background-position:200% center}to{background-position:-200% center} }

.ml-animate-pop {
  animation: ml-pop-in var(--ml-duration-normal) var(--ml-ease-bounce) both;
}

.ml-animate-slide-left {
  animation: ml-slide-left var(--ml-duration-normal) var(--ml-ease-spring) both;
}

.ml-text-shimmer {
  color: var(--ml-primary-text);
}

@supports ((-webkit-background-clip:text) or (background-clip:text)) {
  .ml-text-shimmer {
    background: linear-gradient(90deg,var(--ml-text),var(--ml-primary),var(--ml-text));
    background-size: 200% auto;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: ml-shimmer 3s ease-in-out infinite;
  }
}

@keyframes mlola-glyph-draw { from{stroke-dashoffset:1} }

@keyframes mlola-glyph-fill { from{opacity:0} }

.mlola-glyph[data-animated] > * {
  stroke-dasharray: 1 1;
  animation: mlola-glyph-draw var(--ml-duration-slow) var(--ml-ease-standard) both;
}

.mlola-glyph[data-animated] > *:nth-child(2) { animation-delay: 60ms; }

.mlola-glyph[data-animated] > *:nth-child(3) { animation-delay: 120ms; }

.mlola-glyph[data-animated] > *:nth-child(n+4) { animation-delay: 180ms; }

.mlola-glyph[data-animated] > [fill="currentColor"] {
  stroke-dasharray: none;
  animation-name: mlola-glyph-fill;
}

@media (prefers-reduced-motion:reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-delay: 0s!important;
    animation-duration: .01ms!important;
    animation-iteration-count: 1!important;
    scroll-behavior: auto!important;
    transition-delay: 0s!important;
    transition-duration: .01ms!important;
  }
}

/* @mlola-ui/engine accessibility.css, generated. The sources keep the comments. */
@media (pointer: coarse) {
  :is(input:not([type="checkbox"], [type="radio"], [type="range"], [type="color"], [type="file"], [type="submit"], [type="button"], [type="reset"], [type="image"], [type="hidden"]), textarea, select, [contenteditable]:not([contenteditable="false"])) {
    font-size: max(1rem, 1em);
  }
}
